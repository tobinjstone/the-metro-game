<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Metro Game</title>
<meta name="description" content="Play The Metro Game: pick a Metro line, ride a random number of stops, and discover a new bar, café, restaurant or park near your mystery station.">
<meta name="theme-color" content="#3B2F2A">

<!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
<meta property="og:title" content="The Metro Game" />
<meta property="og:description" content="Board the Unknown. Brave the wilderness of Loudoun Gateway." />
<meta property="og:image" content="images/the-metro-game-social.png" />
<meta property="og:url" content="https://themetrogame.com" />
<meta property="og:type" content="website" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Metro Game">
<meta name="twitter:description" content="Board the Unknown. Brave the wilderness of Loudoun Gateway.">
<meta name="twitter:image" content="/images/the-metro-game-social.png">

<!-- Icons -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />

<!-- Fonts + styles -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css" />
<!-- Metro 50 is the house look; ?theme=classic brings back the map-paper version -->
<script>
  if (new URLSearchParams(location.search).get('theme') !== 'classic')
    document.documentElement.setAttribute('data-theme', 'metro50');
</script>
</head>

<body>
  <!-- Small logo that pins to the top once the game starts -->
  <header id="site-header">
    <button id="home-btn" class="header-logo" type="button" aria-label="Start over">
      <span class="logo-mask" role="img" aria-label="The Metro Game"></span>
    </button>
  </header>

  <main id="stage">

    <!-- INTRO ------------------------------------------------------------>
    <section id="intro-screen" class="screen active">
      <svg id="intro-map" aria-hidden="true"></svg>
      <div class="intro-content">
        <span id="logo" class="logo-mask" role="img" aria-label="The Metro Game"></span>
                <div class="line-strip" aria-hidden="true">
          <i class="Red"></i><i class="Orange"></i><i class="Silver"></i><i class="Blue"></i><i class="Yellow"></i><i class="Green"></i>
        </div>
        <button id="start-btn" class="btn btn-primary btn-lg" type="button" disabled>
          <span class="btn-label">Loading stations…</span>
        </button>
        <p id="load-error" class="load-error" hidden>
          Couldn’t load the places list.
          <button id="retry-btn" class="text-link" type="button">Try again</button>
        </p>
      </div>
    </section>

    <!-- PICK LINE / HUB -------------------------------------------------->
    <section id="line-screen" class="screen" hidden></section>

    <!-- PICK STATION ----------------------------------------------------->
    <section id="station-screen" class="screen" hidden></section>

    <!-- CATEGORY FILTER -------------------------------------------------->
    <section id="category-screen" class="screen" hidden>
      <div class="screen-body">
        <h2 class="screen-title">What are you in the mood for?</h2>
        <p class="subtitle">We’ll find one near your mystery stop.</p>

        <div id="category-grid" class="category-grid">
          <button class="cat-btn" data-cat="Coffee" type="button"><img src="images/coffee.svg" alt=""><span>Coffee</span></button>
          <button class="cat-btn" data-cat="Drinks" type="button"><img src="images/drinks.svg" alt=""><span>Drinks</span></button>
          <button class="cat-btn" data-cat="Food" type="button"><img src="images/food.svg" alt=""><span>Food</span></button>
          <button class="cat-btn" data-cat="Activity" type="button"><img src="images/activity.svg" alt=""><span>Activity</span></button>
          <button class="cat-btn" data-cat="Shopping" type="button"><img src="images/shopping.svg" alt=""><span>Shopping</span></button>
          <button class="cat-btn" data-cat="Surprise" type="button"><img src="images/random.svg" alt=""><span>Surprise me</span></button>
        </div>

        <button id="cat-back-btn" class="text-link back-link" type="button">← Back</button>
      </div>
    </section>

    <!-- MYSTERY TRIP ----------------------------------------------------->
    <section id="trip-screen" class="screen" hidden>
      <div class="screen-body">

        <!-- "thinking" loader -->
        <div id="thinking-box" class="thinking" hidden>
          <div class="signal" aria-hidden="true"><i></i><i></i><i></i></div>
          <p id="thinking-text">Finding your train…</p>
        </div>

        <!-- Ticket -->
        <article id="result-card" class="ticket" hidden>
          <header class="ticket-head">
            <span id="ticket-line" class="line-pill"></span>
            <span id="ticket-dir" class="ticket-dir"></span>
          </header>

          <div class="ticket-stops">
            <div class="stops-box"><span id="stop-number">?</span></div>
            <div class="stops-meta">
              <div id="stops-word" class="stops-word">stops</div>
              <div id="trip-origin" class="trip-origin"></div>
            </div>
          </div>

          <div class="map-frame">
            <svg id="trip-map" role="img" aria-label="Map of your Metro trip"></svg>
          </div>

          <p id="arrival-text" class="arrival-text" aria-live="polite"></p>
        </article>

        <div class="trip-buttons" hidden>
          <button id="arrived-btn" class="btn btn-primary" type="button">I’ve arrived</button>
          <button id="play-again" class="btn btn-secondary" type="button">Start over</button>
        </div>
      </div>
    </section>

    <!-- VENUE RESULT ----------------------------------------------------->
    <section id="venue-screen" class="screen" hidden>
      <div class="screen-body">
        <article id="venue-card" class="venue-card">
          <p id="venue-message" class="vline eyebrow">You’re going to…</p>
          <h2 id="venue-name" class="vline venue-name"></h2>
          <div id="venue-meta" class="vline venue-meta"></div>
          <p id="venue-address" class="vline venue-address"></p>
          <p id="venue-note" class="vline venue-note"></p>

          <div class="venue-actions">
            <a id="venue-maps" class="btn btn-primary" target="_blank" rel="noopener">Open in Google Maps</a>
            <button id="new-place-btn" class="btn btn-secondary" type="button">Find a new place</button>
          </div>
        </article>

        <button id="start-over-btn" class="text-link back-link" type="button">Start over</button>
      </div>
    </section>

  </main>

  <footer class="game-footer">
    <p>Created by <a href="https://x.com/tobinjstone" target="_blank" rel="noopener">Tobin Stone</a> &copy; 2025</p>
    <p>Powered by Google &amp; the WMATA API · Not affiliated with WMATA</p>
  </footer>

  <!-- GSAP (global) then the app (ES module) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
